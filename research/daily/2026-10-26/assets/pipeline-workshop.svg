<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Мастерская мелодий: Crystal, Nanz и два файла</title><desc id="desc">Музыкальная дорожка проходит через Crystal и Nanz, становится файлом нот, затем файлом событий. Z80 выполняет по одной стадии; справа пунктиром показана будущая запись tracker-файла.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#112c35"/><stop offset="1" stop-color="#224a4b"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#8ce1bb"/></marker></defs>
<rect width="1400" height="620" rx="24" fill="url(#bg)"/><rect width="1400" height="620" fill="url(#grid)"/>
<g font-family="Arial, sans-serif"><text x="65" y="66" fill="#97e4bf" font-size="17" letter-spacing="4">ДЕНЬ КОМПИЛЯТОРА · 26 ОКТЯБРЯ 2026</text><text x="65" y="124" fill="#fffaf0" font-size="43" font-weight="700">Одна мелодия. Несколько представлений.</text><text x="65" y="160" fill="#c5d9d5" font-size="21">Высокоуровневый смысл проходит через очень конкретные байты.</text>
<g transform="translate(65 215)"><rect width="220" height="250" rx="16" fill="#fff4df"/><text x="24" y="42" fill="#253b3c" font-size="23" font-weight="700">MIDI</text><text x="24" y="70" fill="#657372" font-size="15">нажать · отпустить · время</text><g stroke="#d3c9b6"><path d="M22 112H198M22 140H198M22 168H198M22 196H198"/></g><g fill="#d27562"><rect x="31" y="101" width="55" height="17" rx="5"/><rect x="76" y="130" width="82" height="17" rx="5"/><rect x="123" y="158" width="59" height="17" rx="5"/></g><text x="24" y="229" fill="#657372" font-size="16">9 058 байт Chronos</text></g>
<g transform="translate(350 244)"><rect width="235" height="190" rx="16" fill="#284e51" stroke="#8ce1bb"/><path d="M35 39L54 22L74 39L54 65Z" fill="#91d9e8"/><text x="89" y="47" fill="#fffaf0" font-size="22" font-weight="700">Crystal</text><text x="25" y="95" fill="#c6e6d7" font-size="18">типизированные kernels</text><path d="M25 119H210" stroke="#537b75"/><text x="25" y="155" fill="#fffaf0" font-size="22" font-weight="700">Nanz + общий HIR</text></g>
<g transform="translate(650 215)"><rect width="220" height="250" rx="16" fill="#d9f2df"/><path d="M158 0V42H220" fill="#b0d8bb"/><text x="24" y="81" fill="#264a36" font-size="23" font-weight="700">NOTES.BIN</text><text x="24" y="116" fill="#43644e" font-size="18">1 485 связанных нот</text><g fill="#80b58e"><rect x="25" y="145" width="170" height="12" rx="3"/><rect x="25" y="168" width="134" height="12" rx="3"/><rect x="25" y="191" width="154" height="12" rx="3"/></g><text x="24" y="229" fill="#43644e" font-size="16">start · off · pitch · source</text></g>
<g transform="translate(935 215)"><rect width="220" height="250" rx="16" fill="#e5eafb"/><path d="M158 0V42H220" fill="#b9c8e6"/><text x="24" y="81" fill="#34476d" font-size="23" font-weight="700">EVENTS.BIN</text><text x="24" y="116" fill="#536380" font-size="18">2 153 события</text><g stroke-width="12" stroke-linecap="round"><path d="M31 152H86M117 152H178" stroke="#849cc7"/><path d="M31 180H58M89 180H178" stroke="#9bb3d7"/><path d="M31 208H123M155 208H178" stroke="#7089b8"/></g></g>
<g stroke="#8ce1bb" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M292 340H334"/><path d="M592 340H635"/><path d="M878 340H920"/></g>
<g transform="translate(1210 266)"><rect width="126" height="148" rx="15" fill="none" stroke="#b3c2bb" stroke-width="2" stroke-dasharray="7 7"/><text x="63" y="56" fill="#e2d0a7" font-size="23" text-anchor="middle">VT2</text><text x="63" y="86" fill="#e2d0a7" font-size="23" text-anchor="middle">VTX</text><text x="63" y="121" fill="#c5d9d5" font-size="14" text-anchor="middle">ещё впереди</text></g>
