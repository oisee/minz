name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_gate_work:
    name: Compiler and frozen gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      build: ${{ steps.build.outcome }}
      stable: ${{ steps.stable.outcome }}
      assemble: ${{ steps.assemble.outcome }}
      metafunctions: ${{ steps.metafunctions.outcome }}
      z3_demo: ${{ steps.z3_demo.outcome }}
      z3_fixtures: ${{ steps.z3_fixtures.outcome }}
    defaults:
      run:
        working-directory: minzc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: minzc/go.mod
          cache-dependency-path: minzc/go.sum
      - name: Build compiler, assembler and emulators
        id: build
        run: |
          go build -o "$RUNNER_TEMP/mz" ./cmd/minzc
          go build -o "$RUNNER_TEMP/mza" ./cmd/mza
          go build -o "$RUNNER_TEMP/mze" ./cmd/mze
          go build -o "$RUNNER_TEMP/mzv" ./cmd/mzv
      - name: Run stable compiler and toolchain tests
        id: stable
        run: |
          go test -short -timeout 30m ./pkg/z80effects/... ./pkg/hir/... ./pkg/mir2/... ./pkg/z80asm/... ./pkg/c89/... ./pkg/codegen/... ./pkg/parser/... ./pkg/plm/... ./pkg/lanz/... ./pkg/lizp/... ./pkg/abap/... ./cmd/mzv/... ./cmd/autosiril-vm/... ./cmd/autosiril-native/... ./cmd/autosiril-midi-native/...
          go test -short -timeout 10m ./cmd/mze/...
          go test -timeout 10m ./cmd/minzc -run '^(TestABAPCPMOrdinaryCLI|TestABAPFrontendCPMCLI|TestABAPSALVCPMCLI|TestAgonZ80RuntimeCLI.*)$' -count=1
          python3 ../scripts/ci/test_stable_pipeline.py
          python3 ../scripts/ci/run_stable_pipeline.py --output "$RUNNER_TEMP/stable-pipeline" --profile fast --shards 3 --workers 3
      - name: Verify frozen upstream system C on VM and Z80
        run: python3 ../research/system-c-validation/validate.py --out "$RUNNER_TEMP/system-c-validation"
      - name: Verify native CP/M MIDI note files
        run: python3 ../research/autosiril-native/files/replay.py --mze "$RUNNER_TEMP/mze" --out "$RUNNER_TEMP/autosiril-file-pair"
      - name: Verify sequential CP/M note and event files
        run: python3 ../research/autosiril-native/file-flatten/replay.py --producer "$RUNNER_TEMP/autosiril-file-pair" --mze "$RUNNER_TEMP/mze" --out "$RUNNER_TEMP/autosiril-file-chain"
      - name: Verify common CP/M and Scorpion TRD transports
        run: |
          go test ./pkg/spectrum ./pkg/spectrum/formats -count=1
          python3 ../research/autosiril-native/transports/replay.py --mze "$RUNNER_TEMP/mze" --out "$RUNNER_TEMP/autosiril-transports"
      - name: Verify both file stages through common chunk API
        run: python3 ../research/autosiril-native/stream-flatten/replay.py --reference "$RUNNER_TEMP/autosiril-file-chain" --producer "$RUNNER_TEMP/autosiril-transports" --mze "$RUNNER_TEMP/mze" --out "$RUNNER_TEMP/autosiril-common-flatten"
      - name: Verify sequential native TRD note and event stages
        run: python3 ../research/autosiril-native/trd-flatten/replay.py --reference "$RUNNER_TEMP/autosiril-file-chain" --producer "$RUNNER_TEMP/autosiril-transports" --out "$RUNNER_TEMP/autosiril-trd-flatten"
      - name: Verify third native arrangement stage on TRD and CP/M
        run: python3 ../research/autosiril-native/arrange/replay.py --trd-upstream "$RUNNER_TEMP/autosiril-trd-flatten" --cpm-upstream "$RUNNER_TEMP/autosiril-common-flatten" --producer "$RUNNER_TEMP/autosiril-transports" --mze "$RUNNER_TEMP/mze" --out "$RUNNER_TEMP/autosiril-arrange"
      - name: Verify fourth native echo stage and all failure contracts
        run: python3 ../research/autosiril-native/echo/replay.py --upstream "$RUNNER_TEMP/autosiril-arrange" --producer "$RUNNER_TEMP/autosiril-transports" --mze "$RUNNER_TEMP/mze" --out "$RUNNER_TEMP/autosiril-echo"
      - name: Preserve native echo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-echo
          path: ${{ runner.temp }}/autosiril-echo/
          if-no-files-found: ignore
      - name: Preserve native arrangement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-arrange
          path: ${{ runner.temp }}/autosiril-arrange/
          if-no-files-found: ignore
      - name: Preserve TRD flatten evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-trd-flatten
          path: ${{ runner.temp }}/autosiril-trd-flatten/
          if-no-files-found: ignore
      - name: Preserve common flatten evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-common-flatten
          path: ${{ runner.temp }}/autosiril-common-flatten/
          if-no-files-found: ignore
      - name: Preserve interchangeable transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-transports
          path: ${{ runner.temp }}/autosiril-transports/
          if-no-files-found: ignore
      - name: Preserve CP/M file chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-file-chain
          path: ${{ runner.temp }}/autosiril-file-chain/
          if-no-files-found: ignore
      - name: Preserve CP/M file producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-file-pair
          path: ${{ runner.temp }}/autosiril-file-pair/
          if-no-files-found: ignore
      - name: Preserve system C inputs and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-c-validation
          path: ${{ runner.temp }}/system-c-validation/
          if-no-files-found: ignore
      - name: Verify embedded demos and Tetris difficulty
        run: go test -tags mzx_headless ./cmd/mzx -run '^(TestEmbeddedDemoBoots|TestEmbeddedTetrisDifficulty|TestDemoDiskSurvivesRelaunch|TestDemoSessionResumes)$' -count=1
      - name: Preserve complete pipeline inventory and shard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-pipeline-shards
          path: ${{ runner.temp }}/stable-pipeline/
          if-no-files-found: ignore
      - name: Compile and assemble a program
        id: assemble
        run: |
          "$RUNNER_TEMP/mz" ../examples/fibonacci.minz -o "$RUNNER_TEMP/fibonacci.a80"
          "$RUNNER_TEMP/mza" -o "$RUNNER_TEMP/fibonacci.bin" "$RUNNER_TEMP/fibonacci.a80"
          test -s "$RUNNER_TEMP/fibonacci.bin"
      - name: Run Nanz language regression tests
        id: metafunctions
        run: |
          go test ./pkg/nanz -skip '^TestShowcaseCompileAssemble$' -count=1
          go test ./cmd/minzc -run '^(TestMetaSpecialize.*|TestMetaSelections.*|TestCLIImportedMetafunctionSizeGoal)$' -count=1
      - name: Run Z3 demo through Nanz on mzv
        id: z3_demo
        run: ../examples/zmachine/zork-west-demo/smoke.sh "$RUNNER_TEMP/mzv"
      - name: Run Z3 conformance fixtures
        id: z3_fixtures
        run: ../examples/zmachine/z3-fixtures/smoke.sh "$RUNNER_TEMP/mzv"

  native_echo_fresh:
    name: Fresh Ruby Crystal native pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oisee/autosiril
          ref: 44925349147d5cd4bf3636c3f0eeffa7b46e261c
          path: .ci-reference/autosiril
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: minzc/go.mod
          cache-dependency-path: minzc/go.sum
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.1
          shards: false
      - name: Install original Ruby oracle and compiler-library dependencies
        env:
          GEM_HOME: ${{ runner.temp }}/autosiril-gems
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby llvm-dev libgc-dev libgmp-dev libevent-dev libpcre2-dev zlib1g-dev
          gem install midilib --version 4.0.2 --no-document
      - name: Rebuild actual Ruby Crystal and all five native stages
        env:
          GEM_HOME: ${{ runner.temp }}/autosiril-gems
          CRYSTAL_CACHE_DIR: ${{ runner.temp }}/crystal-cache
        run: python3 research/autosiril-native/mix/verify.py --autosiril .ci-reference/autosiril --out "$RUNNER_TEMP/autosiril-mix-fresh"
      - name: Preserve complete fresh native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-echo-fresh
          path: ${{ runner.temp }}/autosiril-mix-fresh/upstream/
          retention-days: 7
          if-no-files-found: ignore

      - name: Preserve complete fifth-stage fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-mix-fresh
          path: ${{ runner.temp }}/autosiril-mix-fresh/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build the CP/M chain emulator for the canonical profile
        working-directory: minzc
        run: go build -o "$RUNNER_TEMP/mze-canonical6" ./cmd/mze
      - name: Execute canonical max_offset 6 profile through the complete native file chain
        env:
          GEM_HOME: ${{ runner.temp }}/autosiril-gems
        run: |
          python3 research/autosiril-native/p-channel-fix/prove_canonical6.py \
            --autosiril .ci-reference/autosiril \
            --upstream "$RUNNER_TEMP/autosiril-mix-fresh/upstream/cpm/standalone" \
            --mix-com "$RUNNER_TEMP/autosiril-mix-fresh/cpm/standalone/MIX.COM" \
            --mze "$RUNNER_TEMP/mze-canonical6" \
            --fixture research/autosiril-native/p-channel-fix/fixtures/canonical6-frozen.json.gz \
            --out "$RUNNER_TEMP/autosiril-canonical6-fresh"
      - name: Preserve complete canonical-profile fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-canonical6-fresh
          path: ${{ runner.temp }}/autosiril-canonical6-fresh/
          retention-days: 7
          if-no-files-found: ignore
      - name: Plan the sixth native stage (renderer) against original Ruby
        env:
          GEM_HOME: ${{ runner.temp }}/autosiril-gems
        run: |
          python3 research/autosiril-native/render/prove_planning.py \
            --upstream "$RUNNER_TEMP/autosiril-mix-fresh" \
            --autosiril .ci-reference/autosiril \
            --out "$RUNNER_TEMP/autosiril-render/planning"
      - name: Execute the CP/M renderer on actual kind5 files and the canonical six-COM chain
        env:
          GEM_HOME: ${{ runner.temp }}/autosiril-gems
        run: |
          python3 research/autosiril-native/render/prove_cpm.py \
            --artifacts "$RUNNER_TEMP/autosiril-mix-fresh" \
            --autosiril .ci-reference/autosiril \
            --planning "$RUNNER_TEMP/autosiril-render/planning" \
            --chain6 "$RUNNER_TEMP/autosiril-canonical6-fresh" \
            --mze "$RUNNER_TEMP/mze-canonical6" \
            --out "$RUNNER_TEMP/autosiril-render/cpm"
      - name: Execute the TRD renderer on actual native TRD mix disks with failure guards
        run: |
          python3 research/autosiril-native/render/prove_trd.py \
            --cpm-run "$RUNNER_TEMP/autosiril-render/cpm" \
            --mix-trd "$RUNNER_TEMP/autosiril-mix-fresh/trd/measured" \
            --out "$RUNNER_TEMP/autosiril-render/trd"
      - name: Preserve renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-render-fresh
          path: ${{ runner.temp }}/autosiril-render/
          retention-days: 7
          if-no-files-found: ignore

  native_mix_frozen:
    name: Frozen fifth native stage
    needs: pr_gate_work
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: minzc/go.mod
          cache-dependency-path: minzc/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: autosiril-echo
          path: ${{ runner.temp }}/autosiril-echo
      - name: Replay frozen fifth stage against actual frozen echo files
        run: python3 research/autosiril-native/mix/replay.py --upstream "$RUNNER_TEMP/autosiril-echo" --out "$RUNNER_TEMP/autosiril-mix-frozen"
      - name: Build the CP/M chain emulator for the canonical profile
        working-directory: minzc
        run: go build -o "$RUNNER_TEMP/mze-canonical6" ./cmd/mze
      - name: Replay frozen canonical max_offset 6 profile through the actual chain
        run: |
          python3 research/autosiril-native/p-channel-fix/replay_canonical6.py \
            --upstream "$RUNNER_TEMP/autosiril-echo/cpm/standalone" \
            --mix-com "$RUNNER_TEMP/autosiril-mix-frozen/cpm/standalone/MIX.COM" \
            --mze "$RUNNER_TEMP/mze-canonical6" \
            --out "$RUNNER_TEMP/autosiril-canonical6-frozen"
      - name: Preserve complete fifth-stage frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-mix-frozen
          path: ${{ runner.temp }}/autosiril-mix-frozen/
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve complete canonical-profile frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autosiril-canonical6-frozen
          path: ${{ runner.temp }}/autosiril-canonical6-frozen/
          retention-days: 7
          if-no-files-found: ignore

  pr_gate:
    name: PR gate
    needs: [pr_gate_work, native_echo_fresh, native_mix_frozen]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      native_fresh: ${{ needs.native_echo_fresh.result }}
      native_frozen: ${{ needs.native_mix_frozen.result }}
      build: ${{ needs.pr_gate_work.outputs.build }}
      stable: ${{ needs.pr_gate_work.outputs.stable }}
      assemble: ${{ needs.pr_gate_work.outputs.assemble }}
      metafunctions: ${{ needs.pr_gate_work.outputs.metafunctions }}
      z3_demo: ${{ needs.pr_gate_work.outputs.z3_demo }}
      z3_fixtures: ${{ needs.pr_gate_work.outputs.z3_fixtures }}
    steps:
      - name: Require both inherited frozen and complete fresh pipelines
        env:
          FROZEN_RESULT: ${{ needs.pr_gate_work.result }}
          FRESH_RESULT: ${{ needs.native_echo_fresh.result }}
          MIX_FROZEN_RESULT: ${{ needs.native_mix_frozen.result }}
        run: test "$FROZEN_RESULT" = success && test "$FRESH_RESULT" = success && test "$MIX_FROZEN_RESULT" = success

  pr_report:
    name: PR test report
    needs: pr_gate
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Update one PR comment with test results
        uses: actions/github-script@v7
        env:
          NATIVE_FRESH_RESULT: ${{ needs.pr_gate.outputs.native_fresh }}
          NATIVE_FROZEN_RESULT: ${{ needs.pr_gate.outputs.native_frozen }}
          GATE_RESULT: ${{ needs.pr_gate.result }}
          BUILD_RESULT: ${{ needs.pr_gate.outputs.build }}
          STABLE_RESULT: ${{ needs.pr_gate.outputs.stable }}
          ASSEMBLE_RESULT: ${{ needs.pr_gate.outputs.assemble }}
          META_RESULT: ${{ needs.pr_gate.outputs.metafunctions }}
          DEMO_RESULT: ${{ needs.pr_gate.outputs.z3_demo }}
          FIXTURES_RESULT: ${{ needs.pr_gate.outputs.z3_fixtures }}
        with:
          script: |
            const marker = '<!-- minz-pr-test-report -->';
            const icon = value => value === 'success' ? '🟢 pass' : value === 'failure' ? '🔴 fail' : '⚪ ' + (value || 'not run');
            const checks = [
              ['Complete fresh Ruby/Crystal native pipeline', process.env.NATIVE_FRESH_RESULT],
              ['Inherited compiler and complete frozen native gates', process.env.NATIVE_FROZEN_RESULT],
              ['Build mz, mza, mze, mzv', process.env.BUILD_RESULT],
              ['Fast compiler regressions (deep suites run separately)', process.env.STABLE_RESULT],
              ['Fibonacci compile + assemble', process.env.ASSEMBLE_RESULT],
              ['Nanz language regressions', process.env.META_RESULT],
              ['Z3 West of House demo', process.env.DEMO_RESULT],
              ['Z3 small conformance fixtures', process.env.FIXTURES_RESULT],
            ];
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              marker,
              `### PR tests: ${icon(process.env.GATE_RESULT)}`,
              `Commit: \`${context.payload.pull_request.head.sha.slice(0, 8)}\` · [Full test log](${runUrl})`,
              '',
              '| Check | Result |',
              '| --- | --- |',
              ...checks.map(([name, result]) => `| ${name} | ${icon(result)} |`),
              '',
              'Deep pipeline domains and the full assertion corpus run on release tags, nightly and manual audits.',
              'The external CZECH and full Zork I stories are not part of this PR gate.',
            ];
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.user.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  compiler_checks:
    name: Compiler checks
    # Required on the PR merge tree; repeating the same expensive matrix on
    # main immediately after merge doubles runner use and queues the next PR.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/assert-checks.yml
    with:
      candidate: ${{ github.sha }}
      base: HEAD^1

  advisory_lint:
    name: Advisory Go lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: minzc/go.sum
      - name: Cache pinned golangci-lint binary
        id: lint-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-v2.13.2-go1.26.8
      - name: Install pinned golangci-lint
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Install GUI typecheck dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev
      - name: Report new lint issues and changed-file formatting
        env:
          BASE_SHA: HEAD^1
          REPORT_DIR: ${{ runner.temp }}/lint-report
        run: bash scripts/ci/lint.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advisory-lint-report
          path: ${{ runner.temp }}/lint-report/
