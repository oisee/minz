name: Demo platform packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Demo package version (builds and verifies; does not publish)'
        required: true
        default: '0.25.1'
        type: string

permissions:
  contents: read

env:
  DEMO_VERSION: ${{ inputs.version }}

jobs:
  native:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-amd64
            runner: macos-15-intel
            extension: ''
          - platform: darwin-arm64
            runner: macos-15
            extension: ''
          - platform: windows-amd64
            runner: windows-2022
            extension: '.exe'
          - platform: windows-arm64
            runner: windows-11-arm
            extension: '.exe'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: minzc/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build native GUI and headless executables
        env:
          TARGET: ${{ matrix.platform }}
          EXT: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          mkdir -p out/build
          go version > out/build/toolchain.txt
          printf '%s\n' "$RUNNER_OS/$RUNNER_ARCH" > out/build/runner.txt
          go -C minzc build -trimpath -ldflags "-s -w -X main.version=$DEMO_VERSION -X main.gitCommit=$(git rev-parse --short HEAD)" -o "$PWD/out/build/mzx$EXT" ./cmd/mzx
          go -C minzc build -trimpath -tags mzx_headless -ldflags '-s -w' -o "$PWD/out/build/mzx-headless$EXT" ./cmd/mzx
          go version -m "out/build/mzx$EXT" > out/build/binary-info.txt
          go -C minzc test -tags mzx_headless ./cmd/mzx -run '^(TestEmbeddedDemoBoots|TestEmbeddedTetrisDifficulty|TestDemoDiskSurvivesRelaunch|TestDemoSessionResumes)$' -count=1 > out/build/embedded-tests.txt
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --force --sign - out/build/mzx
            codesign --force --sign - out/build/mzx-headless
          fi
      - name: Package and run final native files
        env:
          TARGET: ${{ matrix.platform }}
          EXT: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          python3 scripts/package_demo_release.py --platform "$TARGET=$PWD/out/build/mzx$EXT" --headless-platform "$TARGET=$PWD/out/build/mzx-headless$EXT" --output out/packages --version "$DEMO_VERSION"
          python3 scripts/verify_demo_release.py "out/packages/minz-demos-${DEMO_VERSION}-$TARGET" --proof out/proof
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --verify --deep --strict "out/packages/minz-demos-$DEMO_VERSION-$TARGET/MinZ Demos.app"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demos-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  linux:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: minzc/go.sum
      - name: Build and verify with Debian Bookworm-compatible libc
        shell: bash
        env:
          TARGET: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p out
          DEMO_GO_ROOT=$(go env GOROOT)
          docker run --rm -e DEMO_VERSION -e TARGET -v "$PWD:/work" -v "$DEMO_GO_ROOT:/opt/go:ro" -w /work -e PATH=/opt/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin -e LIBGL_ALWAYS_SOFTWARE=1 debian:bookworm bash -ec '
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates gcc libc6-dev git python3 pkg-config libasound2-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xauth x11-utils xfonts-base file
            git config --global --add safe.directory /work
            mkdir -p out/build
            go version > out/build/toolchain.txt
            uname -m > out/build/runner.txt
            ldd --version > out/build/libc.txt
            go -C minzc build -trimpath -ldflags "-s -w -X main.version=$DEMO_VERSION -X main.gitCommit=$(git rev-parse --short HEAD)" -o /work/out/build/mzx ./cmd/mzx
            go -C minzc build -trimpath -tags mzx_headless -ldflags "-s -w" -o /work/out/build/mzx-headless ./cmd/mzx
            go version -m out/build/mzx > out/build/binary-info.txt
            go -C minzc test -tags mzx_headless ./cmd/mzx -run "^(TestEmbeddedDemoBoots|TestEmbeddedTetrisDifficulty|TestDemoDiskSurvivesRelaunch|TestDemoSessionResumes)$" -count=1 > out/build/embedded-tests.txt
            file out/build/mzx > out/build/file.txt
            ldd out/build/mzx > out/build/libraries.txt
            python3 scripts/package_demo_release.py --platform "$TARGET=/work/out/build/mzx" --headless-platform "$TARGET=/work/out/build/mzx-headless" --output out/packages --version "$DEMO_VERSION"
            Xvfb :99 -screen 0 1024x768x24 -ac -nolisten tcp > out/xvfb.log 2>&1 &
            DEMO_XVFB_PID=$!
            trap "kill $DEMO_XVFB_PID 2>/dev/null || true" EXIT
            export DISPLAY=:99
            for attempt in $(seq 1 30); do
              if timeout 2 xdpyinfo >/dev/null 2>&1; then break; fi
              sleep 1
            done
            timeout 10 xdpyinfo > out/display.txt
            timeout --kill-after=10 600 python3 -u scripts/verify_demo_release.py "out/packages/minz-demos-${DEMO_VERSION}-$TARGET" --proof out/proof
          '
      - name: Make container-created proof readable by the artifact uploader
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demos-${{ matrix.platform }}
          path: out/
          if-no-files-found: error
